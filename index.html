<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pileup — battle simulator v0.3</title>
  <link rel="stylesheet" href="src/renderer/styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>Pileup</h1>
        <p class="tagline">Battle simulator v0.3</p>
      </div>
      <button id="newBattleBtn" class="btn-primary">New battle</button>
    </header>

    <section class="battlefield">

      <!-- Left pile -->
      <div class="pile-panel" id="leftPilePanel">
        <div class="pile-header">
          <span class="pile-name">Player 1</span>
          <span class="pile-score" id="leftScore">Score: 0</span>
        </div>
        <div class="pile-stack-wrap" id="leftStack"></div>
        <div class="pile-cards" id="leftCards"></div>
      </div>

      <!-- Center arena -->
      <div class="arena">
        <div class="arena-status" id="arenaStatus">Press "New battle" to begin.</div>
        <div class="staging-area">
          <div class="staging-row-wrap">
            <span class="staging-label">P1</span>
            <div class="staging-row" id="leftStaging"></div>
          </div>
          <div class="staging-row-wrap">
            <span class="staging-label">P2</span>
            <div class="staging-row" id="rightStaging"></div>
          </div>
        </div>
        <div class="flip-display" id="flipDisplay"></div>
        <div class="arena-result" id="resultDisplay"></div>
      </div>

      <!-- Right pile -->
      <div class="pile-panel" id="rightPilePanel">
        <div class="pile-header">
          <span class="pile-name">Player 2</span>
          <span class="pile-score" id="rightScore">Score: 0</span>
        </div>
        <div class="pile-stack-wrap" id="rightStack"></div>
        <div class="pile-cards" id="rightCards"></div>
      </div>

    </section>

    <section class="log-panel">
      <div class="log-header">Battle log</div>
      <div class="log" id="log"></div>
    </section>
  </main>

  <!-- Engine: pure logic, no DOM. Order matters: cards -> selection -> abilities -> battle. -->
  <script src="src/engine/cards.js"></script>
  <script src="src/engine/selection.js"></script>
  <script src="src/engine/abilities.js"></script>
  <script src="src/engine/battle.js"></script>

  <!-- Renderer: throwaway, replaced when porting to a real engine. -->
  <script src="src/renderer/main.js"></script>
</body>
</html>
